server {
    listen 80;
    server_name _;

    # One photo per post, capped at 10MB in the app. Headroom for the multipart
    # envelope, and nothing like the old stack's blanket 100M.
    client_max_body_size 12M;

    # TLS terminates at the host nginx in front of us.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # ─── Basemap ──────────────────────────────────────────────────────────────
    # ~1GB .pmtiles, bind-mounted read-only from /opt/pmtiles on the host — never
    # baked into the image, never a named volume. nginx serves HTTP Range natively,
    # which is exactly what the pmtiles client needs to read single tiles out of it.
    location /tiles/ {
        alias /srv/tiles/;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Access-Control-Allow-Origin "";
    }

    # Map glyphs ship in the image (816K) and never change.
    location /fonts/ {
        proxy_pass http://web:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
